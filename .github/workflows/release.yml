# Builds a universal VisDiff.app and publishes it as a GitHub release.
#
# Trigger: push a tag such as v1.0.0, or run it manually from the Actions tab with a version.
#
# Without Apple secrets the app is ad-hoc signed. That works, but macOS will block it on first
# launch until the user allows it (see the release notes this workflow writes).
#
# To ship a signed and notarized app, add these repository secrets:
#   MACOS_CERTIFICATE           base64 of a "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   MACOS_SIGN_IDENTITY         e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID                    Apple ID email used for notarization
#   APPLE_TEAM_ID               10-character team ID
#   APPLE_APP_PASSWORD          app-specific password for that Apple ID
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Work out the version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Test
        run: swift test

      - name: Import the signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build the universal app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ github.run_number }}
          SIGN_IDENTITY: ${{ env.MACOS_CERTIFICATE != '' && secrets.MACOS_SIGN_IDENTITY || '' }}
        run: |
          make release
          lipo -archs build/VisDiff.app/Contents/MacOS/VisDiff
          codesign --verify --deep --strict build/VisDiff.app

      - name: Notarize
        if: env.MACOS_CERTIFICATE != '' && env.APPLE_ID != ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent build/VisDiff.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple build/VisDiff.app

      - name: Package
        id: package
        run: |
          ZIP="VisDiff-${{ steps.version.outputs.version }}.zip"
          ditto -c -k --keepParent build/VisDiff.app "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          cat "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          {
            echo "### Install"
            echo
            echo "1. Download \`${{ steps.package.outputs.zip }}\` below and unzip it."
            echo "2. Move \`VisDiff.app\` to Applications."
            if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$APPLE_ID" ]; then
              echo "3. This build is not notarized, so macOS blocks the first launch. Open it once, then go to"
              echo "   System Settings → Privacy & Security and click **Open Anyway**. Or run:"
              echo "   \`xattr -dr com.apple.quarantine /Applications/VisDiff.app\`"
            fi
            echo
            echo "Requires macOS 26 or later. Universal: Apple silicon and Intel."
            echo
          } > "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release create "$TAG" \
            "${{ steps.package.outputs.zip }}" "${{ steps.package.outputs.zip }}.sha256" \
            --title "VisDiff ${{ steps.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --target "$GITHUB_SHA"

      - name: Clean up the keychain
        if: always() && env.MACOS_CERTIFICATE != ''
        run: security delete-keychain build.keychain || true
